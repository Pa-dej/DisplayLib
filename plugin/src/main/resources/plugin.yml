name: DisplayLib
version: '${version}'
main: padej.displayLib.DisplayLib
api-version: '1.21'
load: STARTUP
authors: [ Padej_ ]
description: Interactive 3D screens on Display entities, scripted in Jumper

commands:
  displaylib:
    description: Main DisplayLib command
    usage: /displaylib <open|close|list|openpublic|closepublic|listpublic|reload|examples>
    aliases: [dlib, dl]

permissions:
  displaylib.admin:
    description: Admin permissions for DisplayLib
    default: op
