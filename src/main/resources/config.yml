# DisplayLib

# Следить за папкой screens/ и перечитывать изменённые YAML-файлы экранов без /displaylib reload.
# На боевом сервере можно выключить.
hot-reload: true

# Демонстрационные слушатели из пакета test_events (экспериментальные предметы в руке:
# уголь, пшеница, красители и т.д.). Нужны только при разработке самого плагина.
test-listeners: false
