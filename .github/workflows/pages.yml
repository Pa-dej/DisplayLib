name: pages

# Документация (VitePress) в корень сайта, редактор - в /editor/:
#   https://pa-dej.github.io/DisplayLib/          документация
#   https://pa-dej.github.io/DisplayLib/editor/   редактор экранов
on:
  push:
    branches: [master, jumper]
    paths: ['docs/**', 'web-ui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build editor
        working-directory: web-ui
        run: npm ci && npm run build
      - name: Build docs
        working-directory: docs
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p docs/.vitepress/dist/editor
          cp -r web-ui/dist/. docs/.vitepress/dist/editor/
          touch docs/.vitepress/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
